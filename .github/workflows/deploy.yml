# TEMPORARY one-off data deploy for manhwafreedev.
#
# Same as the code-only deploy, but ALSO uploads the catalog data
# files and deletes the merged-away loser detail file, so the
# Barbarian duplicate merge reaches the live site without
# re-running the fetcher. REVERT to code-only after this deploy.
name: Deploy Site Code

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Deploy site code to live site (FTP)
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASS" ]; then
            echo "FTP_PASSWORD secret not set, skipping deploy"
            exit 1
          fi
          upload_one() {
            local f="$1"
            if curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" --ftp-create-dirs -T "$f" "ftp://ftpupload.net/htdocs/$f"; then
              echo "OK $f"
            else
              echo "FAIL $f"
              return 1
            fi
          }
          export FTP_USER FTP_PASS
          export -f upload_one
          {
            for f in .htaccess index.php manga.php read.php img.php api.php yubkzrmdwv.php lib/*.php lib/adapters/*.php assets/style.css data/catalog.json data/image-hosts.json data/image-referers.json data/source-patterns.json data/titles/*.json; do
              printf '%s\n' "$f"
            done
          } | xargs -P 4 -I{} bash -c 'upload_one "$@"' _ {}
          curl -s --max-time 30 -u "$FTP_USER:$FTP_PASS" "ftp://ftpupload.net/htdocs/" -Q "-DELE status.php" || true
          curl -s --max-time 30 -u "$FTP_USER:$FTP_PASS" "ftp://ftpupload.net/htdocs/" -Q "-DELE data/titles/barbarian-from-the-middle-ages.json" || true
