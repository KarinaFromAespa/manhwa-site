# Hourly catalog scraper for manhwafreedev.
#
# Runs the stdlib-only Python scraper and commits ONLY its outputs
# back to main: data/catalog.json, data/titles/*.json,
# data/image-hosts.json, data/image-referers.json and
# scraper/state.json. Never docs/, lib/, or the registry. Then it
# FTPs the catalog outputs to the live site (InfinityFree,
# /htdocs/data/) using the repo secrets FTP_USERNAME and
# FTP_PASSWORD — add both under Settings → Secrets and variables →
# Actions. The FTP step is skipped until FTP_PASSWORD exists, so the
# workflow is safe to run before then. Site code (index.php, lib/)
# is NOT deployed here; that still goes through the repo-first
# manual FTP deploy.
name: Scrape catalog

on:
  schedule:
    - cron: "0 * * * *"  # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-catalog
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run scraper
        run: python3 scraper/scrape.py

      - name: Commit catalog outputs
        run: |
          git config user.name "manhwafreedev-scraper"
          git config user.email "scraper@manhwafreedev.local"
          git add data/catalog.json data/image-hosts.json data/image-referers.json data/source-patterns.json scraper/state.json
          git add data/titles 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Scrape catalog $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Deploy catalog to live site (FTP)
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASS" ]; then
            echo "FTP_PASSWORD secret not set, skipping deploy"
            exit 0
          fi
          fail=0
          for f in data/catalog.json data/image-hosts.json data/image-referers.json data/source-patterns.json data/titles/*.json; do
            if curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" --ftp-create-dirs -T "$f" "ftp://ftpupload.net/htdocs/$f"; then
              echo "OK $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done
          exit $fail
