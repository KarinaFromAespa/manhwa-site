# Fetches ONLY the sources GitHub Actions cannot reach directly
# (mangaforfree's ajax/chapters POST and zinmanga-net's API are
# blocked from datacenter IPs), through a working free proxy.
#
# The proxy list (iplocate) is refreshed every 30 min, so every run
# downloads a fresh list and tests it — a proxy that works now may
# be dead next time. Only http/https proxies are used: the fetcher's
# urllib ProxyHandler has no SOCKS support.
#
# Runs every 2 hours at :30 (offset from the main fetcher). It
# shares the fetch-catalog concurrency group with fetch.yml and
# backfill-gaps.yml, so it serialises with them instead of racing
# on the FTP catalog — that is what keeps it from clashing.
# NOTE: like fetch.yml, GitHub's schedule: does not fire reliably;
# point a cron-job.org job at this workflow's dispatch endpoint for
# reliable 2-hourly runs.
name: Fetch Blocked Sources (proxy)

on:
  schedule:
    - cron: "30 */2 * * *"  # every 2 hours at :30
  workflow_dispatch:

concurrency:
  group: fetch-catalog
  cancel-in-progress: false

jobs:
  fetch-blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find a working proxy (fresh iplocate list)
        id: proxy
        run: |
          PROXY_URL="$(python3 fetcher/find_proxy.py)" || true
          if [ -n "$PROXY_URL" ]; then
            echo "proxy=$PROXY_URL" >> "$GITHUB_OUTPUT"
            echo "Using proxy: $PROXY_URL"
          else
            echo "No working proxy found this run; skipping the fetch."
          fi

      - name: Download base catalog from live site (FTP)
        if: steps.proxy.outputs.proxy != ''
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Same base download as fetch.yml's merge job: the catalog
          # lives ONLY on the live site (FTP), never in git.
          mkdir -p data/titles fetcher
          for f in data/catalog.json data/image-hosts.json data/image-referers.json data/source-patterns.json; do
            curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" -o "$f" "ftp://ftpupload.net/htdocs/$f" || echo "WARN: no $f on server"
          done
          curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" -o fetcher/state.json "ftp://ftpupload.net/htdocs/data/state.json" || echo "WARN: no state.json on server"
          python3 - <<'EOF'
          import json
          from pathlib import Path
          try:
              cat = json.loads(Path("data/catalog.json").read_text())
          except Exception:
              print("no catalog.json, starting from empty")
              raise SystemExit(0)
          ids = [t["id"] for t in cat.get("titles", []) if t.get("id")]
          Path("/tmp/title_ids.txt").write_text("\n".join(f"data/titles/{i}.json" for i in ids))
          print(f"base catalog has {len(ids)} titles")
          EOF
          if [ -s /tmp/title_ids.txt ]; then
            cat /tmp/title_ids.txt | xargs -P 4 -I{} curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" -o "{}" "ftp://ftpupload.net/htdocs/{}" || true
          fi
          echo "base download done: $(ls data/titles/*.json 2>/dev/null | wc -l) title files"

      - name: Fetch blocked sources via proxy
        if: steps.proxy.outputs.proxy != ''
        run: |
          python3 fetcher/fetcher.py --backfill-gaps --sources mangaforfree,zinmanga-net --proxy "${{ steps.proxy.outputs.proxy }}" --max-seconds 1500 --max-requests 1200

      - name: Deploy updated catalog data to live site (FTP)
        if: steps.proxy.outputs.proxy != ''
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASS" ]; then
            echo "FTP_PASSWORD secret not set, skipping deploy"
            exit 0
          fi
          # Data files only — the main fetcher deploys the site code.
          upload_one() {
            local f="$1"
            if curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" --ftp-create-dirs -T "$f" "ftp://ftpupload.net/htdocs/$f"; then
              echo "OK $f"
            else
              echo "FAIL $f"
              return 1
            fi
          }
          export FTP_USER FTP_PASS
          export -f upload_one
          {
            for f in data/catalog.json data/image-hosts.json data/image-referers.json data/source-patterns.json data/titles/*.json; do
              printf '%s\n' "$f"
            done
          } | xargs -P 4 -I{} bash -c 'upload_one "$@"' _ {}
          # Delete detail files for junk titles the fetcher pruned
          # this run (same as fetch.yml's deploy step).
          if [ -s data/pruned-titles.txt ]; then
            while IFS= read -r pid; do
              [ -n "$pid" ] || continue
              curl -s --max-time 30 -u "$FTP_USER:$FTP_PASS" "ftp://ftpupload.net/htdocs/" -Q "-DELE data/titles/$pid.json" && echo "DELETED data/titles/$pid.json" || echo "WARN: could not delete data/titles/$pid.json"
            done < data/pruned-titles.txt
          fi
          curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" --ftp-create-dirs -T fetcher/state.json "ftp://ftpupload.net/htdocs/data/state.json" || echo "WARN: state.json upload failed"
