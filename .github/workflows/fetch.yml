# Hourly catalog fetcher for manhwafreedev.
#
# Parallel fetch: the v1 source list is split into 3 shards and each
# shard runs on its own runner (matrix). A shard fetches only its
# slice and writes just the titles it touched, plus a manifest, to
# data/shard-N (never to data/ itself, so shards cannot clobber each
# other). The merge job then combines the three shards on top of the
# base catalog, which lives ONLY on the live site (FTP) — never in
# git. The merge job downloads the base catalog from FTP, merges,
# and FTPs the site code AND the catalog outputs back to the live
# site (InfinityFree, /htdocs/) using the repo secrets FTP_USERNAME
# and FTP_PASSWORD. The FTP transfer runs 3 files in parallel
# (xargs -P 3): the server allows only 7 simultaneous connections
# per account, so 3 leaves headroom when two runs overlap (3+3=6).
# The sequential transfer was the slow part of the run.
# Nothing catalog-related is ever committed to the repo.
name: Fetching Data

on:
  schedule:
    - cron: "0 * * * *"  # hourly
  workflow_dispatch:

concurrency:
  group: fetch-catalog
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run fetcher shard
        run: python3 fetcher/fetcher.py --shard ${{ matrix.shard }}/3 --shard-out data/shard-${{ matrix.shard }}

      - name: Upload shard output
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: data/shard-${{ matrix.shard }}
          if-no-files-found: error

  merge:
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download shard outputs
        uses: actions/download-artifact@v4
        with:
          path: data
          pattern: shard-*
          merge-multiple: false

      - name: Download base catalog from live site (FTP)
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # The catalog lives ONLY on the live site (FTP), never in
          # git. Download it as the merge base; the merge writes the
          # updated catalog back to data/ for the FTP deploy below.
          mkdir -p data/titles fetcher
          for f in data/catalog.json data/image-hosts.json data/image-referers.json data/source-patterns.json; do
            curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" -o "$f" "ftp://ftpupload.net/htdocs/$f" || echo "WARN: no $f on server"
          done
          curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" -o fetcher/state.json "ftp://ftpupload.net/htdocs/data/state.json" || echo "WARN: no state.json on server"
          python3 - <<'EOF'
          import json
          from pathlib import Path
          try:
              cat = json.loads(Path("data/catalog.json").read_text())
          except Exception:
              print("no catalog.json, starting from empty")
              raise SystemExit(0)
          ids = [t["id"] for t in cat.get("titles", []) if t.get("id")]
          Path("/tmp/title_ids.txt").write_text("\n".join(f"data/titles/{i}.json" for i in ids))
          print(f"base catalog has {len(ids)} titles")
          EOF
          if [ -s /tmp/title_ids.txt ]; then
            cat /tmp/title_ids.txt | xargs -P 3 -I{} curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" -o "{}" "ftp://ftpupload.net/htdocs/{}" || true
          fi
          echo "base download done: $(ls data/titles/*.json 2>/dev/null | wc -l) title files"

      - name: Merge shards into the catalog
        run: python3 fetcher/merge_shards.py --root . data/shard-0 data/shard-1 data/shard-2

      - name: Deploy site + catalog to live site (FTP)
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASS" ]; then
            echo "FTP_PASSWORD secret not set, skipping deploy"
            exit 0
          fi
          # Parallel upload (3 at a time): the sequential loop was
          # the slow part of the run. xargs exits 123 if any upload
          # fails, which fails this step.
          upload_one() {
            local f="$1"
            if curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" --ftp-create-dirs -T "$f" "ftp://ftpupload.net/htdocs/$f"; then
              echo "OK $f"
            else
              echo "FAIL $f"
              return 1
            fi
          }
          export FTP_USER FTP_PASS
          export -f upload_one
          {
            for f in .htaccess index.php manga.php read.php img.php api.php yubkzrmdwv.php lib/*.php lib/adapters/*.php assets/style.css data/catalog.json data/image-hosts.json data/image-referers.json data/source-patterns.json data/titles/*.json; do
              printf '%s\n' "$f"
            done
          } | xargs -P 3 -I{} bash -c 'upload_one "$@"' _ {}
          curl -s --max-time 30 -u "$FTP_USER:$FTP_PASS" "ftp://ftpupload.net/htdocs/" -Q "-DELE status.php" || true
          # Fetcher runtime state (reliability + seed cursor) also
          # lives on the live site, never in git.
          # Delete detail files for junk titles the fetcher pruned
          # this run (dropped from the catalog index and removed
          # locally; the upload above cannot delete them).
          if [ -s data/pruned-titles.txt ]; then
            while IFS= read -r pid; do
              [ -n "$pid" ] || continue
              curl -s --max-time 30 -u "$FTP_USER:$FTP_PASS" "ftp://ftpupload.net/htdocs/" -Q "-DELE data/titles/$pid.json" && echo "DELETED data/titles/$pid.json" || echo "WARN: could not delete data/titles/$pid.json"
            done < data/pruned-titles.txt
          fi
          curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" --ftp-create-dirs -T fetcher/state.json "ftp://ftpupload.net/htdocs/data/state.json" || echo "WARN: state.json upload failed"
