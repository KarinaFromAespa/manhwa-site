# Hourly catalog fetcher for manhwafreedev.
#
# Runs the stdlib-only Python fetcher and commits ONLY its outputs
# back to main: data/catalog.json, data/titles/*.json,
# data/image-hosts.json, data/image-referers.json and
# fetcher/state.json. Never docs/, lib/, or the registry. Then it
# FTPs the site code AND the catalog outputs to the live site
# (InfinityFree, /htdocs/) using the repo secrets FTP_USERNAME and
# FTP_PASSWORD — add both under Settings → Secrets and variables →
# Actions. The FTP step is skipped until FTP_PASSWORD exists, so the
# workflow is safe to run before then. Because the FTP step uploads
# the site code from the checkout, the live site tracks main: every
# push to main is deployed within the hour (and immediately on a
# manual dispatch), so no separate manual FTP deploy is needed.
name: Fetching Data

on:
  schedule:
    - cron: "0 * * * *"  # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-catalog
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run fetcher
        run: python3 fetcher/scrape.py

      - name: Commit catalog outputs
        run: |
          git config user.name "manhwafreedev-fetcher"
          git config user.email "fetcher@manhwafreedev.local"
          git add data/catalog.json data/image-hosts.json data/image-referers.json data/source-patterns.json fetcher/state.json
          git add data/titles 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Fetch catalog $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Deploy site + catalog to live site (FTP)
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASS" ]; then
            echo "FTP_PASSWORD secret not set, skipping deploy"
            exit 0
          fi
          fail=0
          for f in .htaccess index.php manga.php read.php img.php api.php yubkzrmdwv.php lib/*.php lib/adapters/*.php assets/style.css data/catalog.json data/image-hosts.json data/image-referers.json data/source-patterns.json data/titles/*.json; do
            if curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" --ftp-create-dirs -T "$f" "ftp://ftpupload.net/htdocs/$f"; then
              echo "OK $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done
          curl -s --max-time 30 -u "$FTP_USER:$FTP_PASS" "ftp://ftpupload.net/htdocs/" -Q "-DELE status.php" || true
          exit $fail
