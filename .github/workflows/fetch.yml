# Hourly catalog fetcher for manhwafreedev.
#
# Parallel fetch: the v1 source list is split into 3 shards and each
# shard runs on its own runner (matrix). A shard fetches only its
# slice and writes just the titles it touched, plus a manifest, to
# data/shard-N (never to data/ itself, so shards cannot clobber each
# other). The merge job then combines the three shards on top of the
# checked-out base catalog, commits ONLY the merged outputs back to
# main (data/catalog.json, data/titles/*.json, data/image-hosts.json,
# data/image-referers.json, data/source-patterns.json and
# fetcher/state.json — never docs/, lib/, or the registry), and FTPs
# the site code AND the catalog outputs to the live site
# (InfinityFree, /htdocs/) using the repo secrets FTP_USERNAME and
# FTP_PASSWORD. The FTP upload runs 4 files in parallel (xargs -P 4)
# because the sequential upload was the slow part of the run.
name: Fetching Data

on:
  schedule:
    - cron: "0 * * * *"  # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-catalog
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run fetcher shard
        run: python3 fetcher/scrape.py --shard ${{ matrix.shard }}/3 --shard-out data/shard-${{ matrix.shard }}

      - name: Upload shard output
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: data/shard-${{ matrix.shard }}
          if-no-files-found: error

  merge:
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download shard outputs
        uses: actions/download-artifact@v4
        with:
          path: data
          pattern: shard-*
          merge-multiple: false

      - name: Merge shards into the catalog
        run: python3 fetcher/merge_shards.py --root . data/shard-0 data/shard-1 data/shard-2

      - name: Commit catalog outputs
        run: |
          git config user.name "manhwafreedev-fetcher"
          git config user.email "fetcher@manhwafreedev.local"
          git add data/catalog.json data/image-hosts.json data/image-referers.json data/source-patterns.json fetcher/state.json
          git add data/titles 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Fetch catalog $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Main may have moved (code pushes) while the shards were
          # fetching; rebase the catalog commit onto the latest main
          # so the push does not fail as non-fast-forward. Code pushes
          # touch code files and the fetch only touches data/ files,
          # so the rebase is conflict-free.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Deploy site + catalog to live site (FTP)
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASS" ]; then
            echo "FTP_PASSWORD secret not set, skipping deploy"
            exit 0
          fi
          # Parallel upload (4 at a time): the sequential loop was
          # the slow part of the run. xargs exits 123 if any upload
          # fails, which fails this step.
          upload_one() {
            local f="$1"
            if curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" --ftp-create-dirs -T "$f" "ftp://ftpupload.net/htdocs/$f"; then
              echo "OK $f"
            else
              echo "FAIL $f"
              return 1
            fi
          }
          export FTP_USER FTP_PASS
          export -f upload_one
          {
            for f in .htaccess index.php manga.php read.php img.php api.php yubkzrmdwv.php lib/*.php lib/adapters/*.php assets/style.css data/catalog.json data/image-hosts.json data/image-referers.json data/source-patterns.json data/titles/*.json; do
              printf '%s\n' "$f"
            done
          } | xargs -P 4 -I{} bash -c 'upload_one "$@"' _ {}
          curl -s --max-time 30 -u "$FTP_USER:$FTP_PASS" "ftp://ftpupload.net/htdocs/" -Q "-DELE status.php" || true
