# Targeted backfill: re-fetch titles whose stored chapter list is
# incomplete (gap) or empty (hollow), found from the catalog.
#
# The hourly fetcher only sees the latest 2 archive pages per
# source, so old titles with gaps never surface there. This runs
# the fetcher in --backfill-gaps mode, which finds gap/hollow
# pairs from the stored catalog and re-fetches each one so
# complete_chapter_list fills the list. Run on demand; the hourly
# workflow keeps doing latest-updates in between.
#
# The catalog lives ONLY on the live site (FTP), never in git. The
# backfill downloads the base catalog from FTP, fetches on top of
# it, and FTPs the result back. Nothing catalog-related is ever
# committed to the repo.
name: Backfill Chapter Gaps

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Comma-separated canonical title ids to force-re-fetch (option A). Leave empty for the auto-detected gap/hollow pairs."
        required: false
        default: ""

concurrency:
  group: fetch-catalog
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download base catalog from live site (FTP)
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p data/titles fetcher
          for f in data/catalog.json data/image-hosts.json data/image-referers.json data/source-patterns.json; do
            curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" -o "$f" "ftp://ftpupload.net/htdocs/$f" || echo "WARN: no $f on server"
          done
          curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" -o fetcher/state.json "ftp://ftpupload.net/htdocs/data/state.json" || echo "WARN: no state.json on server"
          python3 - <<'EOF'
          import json
          from pathlib import Path
          try:
              cat = json.loads(Path("data/catalog.json").read_text())
          except Exception:
              print("no catalog.json, aborting")
              raise SystemExit(1)
          ids = [t["id"] for t in cat.get("titles", []) if t.get("id")]
          Path("/tmp/title_ids.txt").write_text("\n".join(f"data/titles/{i}.json" for i in ids))
          print(f"base catalog has {len(ids)} titles")
          EOF
          if [ -s /tmp/title_ids.txt ]; then
            cat /tmp/title_ids.txt | xargs -P 3 -I{} curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" -o "{}" "ftp://ftpupload.net/htdocs/{}" || true
          fi
          # A partial base download silently drops titles from the
          # merged catalog (run 46105566606: 1056 of 1795 files, and
          # the merge published a 1092-title catalog). Retry whatever
          # is still missing or empty, then refuse to continue rather
          # than publish a shrunken catalog.
          expected=$(wc -l < /tmp/title_ids.txt 2>/dev/null || echo 0)
          for pass in 1 2; do
            find data/titles -maxdepth 1 -name '*.json' -size 0c -delete 2>/dev/null || true
            got=$(find data/titles -maxdepth 1 -name '*.json' -size +0c 2>/dev/null | wc -l)
            [ "$got" -ge "$expected" ] && break
            comm -23 <(sort /tmp/title_ids.txt) <(find data/titles -maxdepth 1 -name '*.json' -size +0c 2>/dev/null | sort) | xargs -r -P 3 -I{} curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" -o "{}" "ftp://ftpupload.net/htdocs/{}" || true
          done
          got=$(find data/titles -maxdepth 1 -name '*.json' -size +0c 2>/dev/null | wc -l)
          echo "base download done: $got of $expected title files"
          if [ "$got" -lt "$expected" ]; then
            echo "ERROR: base download incomplete ($got of $expected title files after retry); refusing to merge a partial base"
            exit 1
          fi

      - name: Run backfill
        run: |
          if [ -n "${{ inputs.slugs }}" ]; then
            python3 fetcher/fetcher.py --backfill-gaps --slugs "${{ inputs.slugs }}" --max-seconds 1500 --max-requests 1200
          else
            python3 fetcher/fetcher.py --backfill-gaps --max-seconds 1500 --max-requests 1200
          fi


      - name: Sanity-check catalog size before deploy
        run: |
          python3 - <<'EOF'
          import json
          from pathlib import Path
          base = sum(1 for _ in Path("/tmp/title_ids.txt").read_text().splitlines()) if Path("/tmp/title_ids.txt").exists() else 0
          pruned = sum(1 for _ in Path("data/pruned-titles.txt").read_text().splitlines()) if Path("data/pruned-titles.txt").is_file() else 0
          merged = len(json.loads(Path("data/catalog.json").read_text()).get("titles", []))
          print(f"catalog size check: merged {merged} titles (base {base}, pruned {pruned})")
          if merged < base - pruned:
              print(f"ERROR: merged catalog ({merged}) is smaller than base minus pruned ({base - pruned}); refusing to deploy a shrunken catalog")
              raise SystemExit(1)
          EOF

      - name: Deploy catalog to live site (FTP)
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASS" ]; then
            echo "FTP_PASSWORD secret not set, skipping deploy"
            exit 0
          fi
          # Parallel upload (3 at a time): the sequential loop was
          # the slow part of the run. xargs exits 123 if any upload
          # fails, which fails this step.
          upload_one() {
            local f="$1"
            if curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" --ftp-create-dirs -T "$f" "ftp://ftpupload.net/htdocs/$f"; then
              echo "OK $f"
            else
              echo "FAIL $f"
              return 1
            fi
          }
          export FTP_USER FTP_PASS
          export -f upload_one
          {
            for f in data/catalog.json data/image-hosts.json data/image-referers.json data/source-patterns.json data/titles/*.json; do
              printf '%s\n' "$f"
            done
          } | xargs -P 3 -I{} bash -c 'upload_one "$@"' _ {}
          # Delete detail files for junk titles the fetcher pruned
          # this run (dropped from the catalog index and removed
          # locally; the upload above cannot delete them).
          if [ -s data/pruned-titles.txt ]; then
            while IFS= read -r pid; do
              [ -n "$pid" ] || continue
              curl -s --max-time 30 -u "$FTP_USER:$FTP_PASS" "ftp://ftpupload.net/htdocs/" -Q "-DELE data/titles/$pid.json" && echo "DELETED data/titles/$pid.json" || echo "WARN: could not delete data/titles/$pid.json"
            done < data/pruned-titles.txt
          fi
          curl -s --max-time 60 -u "$FTP_USER:$FTP_PASS" --ftp-create-dirs -T fetcher/state.json "ftp://ftpupload.net/htdocs/data/state.json" || echo "WARN: state.json upload failed"
